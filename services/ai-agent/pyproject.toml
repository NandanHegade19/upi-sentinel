[project]
name = "ai-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "groq>=1.7.0",
    "langchain-text-splitters>=1.1.3",
    "numpy<2.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.2",
    "pypdf>=6.21.4",
    "python-dotenv>=1.2.4",
    "qdrant-client>=1.12.1",
    "sentence-transformers>=5.7.0",
    "torch<=2.2.2",
    "transformers<4.44",
    "uvicorn>=0.54.0",
]

[project.scripts]
ai-agent = "ai_agent:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
